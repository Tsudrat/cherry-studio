# Oh My Classic Cherry — unsigned personal builds (manual only).
# Builds macOS arm64 + Windows x64 and attaches them to a GitHub Release.
# No Apple/Windows code signing secrets — do not add CSC_* / APPLE_*.

name: OMCC Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty to use v + package.json version)"
        required: false
        type: string
        default: ""
      platform:
        description: "Build platform"
        required: true
        type: choice
        default: all
        options:
          - all
          - mac
          - windows
      draft:
        description: "Create release as draft"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Resolve tag from package.json
        id: resolve
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          INPUT_TAG="${{ inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v${PKG_VERSION}"
          fi
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *) VERSION="$TAG"; TAG="v${TAG}" ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag=${TAG} version=${VERSION}"

  build:
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(
          inputs.platform == 'mac' && '["macos-latest"]' ||
          inputs.platform == 'windows' && '["windows-2022"]' ||
          '["macos-latest", "windows-2022"]'
          ) }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Align package.json version with release tag
        shell: bash
        run: npm version "${{ needs.meta.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: macos dependencies fix
        if: runner.os == 'macOS'
        run: brew install python-setuptools

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install

      - name: Build macOS arm64 (unsigned / ad-hoc)
        if: runner.os == 'macOS'
        run: pnpm build:mac:arm64
        env:
          # Explicitly skip certificate discovery; never set CSC_LINK / APPLE_*.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_CHERRYAI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRYAI_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}

      - name: Build Windows x64 (unsigned)
        if: runner.os == 'Windows'
        run: pnpm build:win:x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_CHERRYAI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRYAI_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          if [ "${{ runner.os }}" = "macOS" ]; then
            find dist -maxdepth 1 \( -name '*-arm64.dmg' -o -name '*-arm64.zip' \) -exec cp {} release-assets/ \;
          else
            find dist -maxdepth 1 \( -name '*-x64-setup.exe' -o -name '*-x64-portable.exe' \) -exec cp {} release-assets/ \;
          fi
          echo "Collected:"
          ls -lh release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omcc-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: omcc-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Oh My Classic Cherry ${{ needs.meta.outputs.version }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            Personal **Oh My Classic Cherry** build (`${{ needs.meta.outputs.version }}`).

            ### Artifacts
            - macOS: arm64 `.dmg` / `.zip` (ad-hoc unsigned — Gatekeeper may prompt)
            - Windows: x64 setup / portable (unsigned — SmartScreen may warn)

            ### Install notes
            - **macOS**: If macOS blocks the app: System Settings → Privacy & Security → Allow, or run `xattr -cr` on the `.app`.
            - **Windows**: If SmartScreen appears: More info → Run anyway.

            No official auto-update. Shares official `appId` / data directory when installed as Cherry Studio.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
